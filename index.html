<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <div class="pro"><h1 class="pro">PROJECT USING HTML CSS AND JS</h1></div> -->
    <div id="form">
        <h1 class="title">Sign Up</h1>

    <input id="unName" class="reg-form" type="text" placeholder="Enter Your Name">
    <input id="mail" class="reg-form" type="email" placeholder="Enter Your Email">
    <input id="pwd" class="reg-form" type="password" placeholder="Enter Your Password">
    <input id="birth" class="reg-form" type="date" placeholder="Enter Your DOB">
    <input id="mob" class="reg-form" type="tel" placeholder="Enter Your Number">
    <div class="btn">
    <button id="regist" class="reg-form">Log in</button>
    <button id="clear" class="reg-form">Reset</button>
    </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
