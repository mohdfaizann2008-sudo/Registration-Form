<!DOCTYPE html>
<html lang="en">
<head>

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- <div class="pro"><h1 class="pro">PROJECT USING HTML CSS AND JS</h1></div> -->
    <div id="form">
        <h1 class="title">Sign Up</h1>
    <h3 class="heading-1">Username:</h3>
    <input id="unName" class="reg-form" type="text" placeholder="Enter Your Name">
    <p id="para-1"></p>
    <h3 class="heading-1">Email:</h3>
    <input id="mail" class="reg-form" type="email" placeholder="Enter Your Email">
    <p id="para-2"></p>
    <h3 class="heading-1">Password:</h3>
    <input id="pwd" class="reg-form" type="password" placeholder="Enter Your Password">
    <p id="para-3"></p>
    <h3 class="heading-1">Confirm password:</h3>
    <input id="cnfpass" class="reg-form" type="password" placeholder="Enter Your Confirm Password">
    <p id="para-4"></p>
    <button id="regist" class="reg-form">SIGNUP</button>
    <!-- <button id="clear" class="reg-form">Reset</button> -->
    </div>
    </div>

    </div>
    
    <script src="script.js"></script>
